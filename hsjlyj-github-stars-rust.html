  :root {
    --bg: #0a0e1a; --surface: #111827; --surface2: #1a2235;
    --border: #1e293b; --border-hover: #334155;
    --text: #e2e8f0; --text-muted: #94a3b8; --accent: #3b82f6;
    --accent2: #8b5cf6; --star: #f59e0b; --green: #10b981;
    --red: #ef4444; --pink: #ec4899; --cyan: #06b6d4;
    --glow-blue: rgba(59,130,246,0.4);
    --glow-purple: rgba(139,92,246,0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;

      radial-gradient(ellipse at 80% 20%, rgba(139,92,246,0.05) 0%, transparent 50%),

  /* 粒子背景 */
  .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .particle {
    position: absolute; border-radius: 50%; background: rgba(59,130,246,0.15);

  .container { max-width: 1400px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }

  header { text-align: center; margin-bottom: 2rem; animation: fadeInUp 0.8s ease-out; }
  header h1 {

    background-size: 300% 300%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 6s ease infinite;
  }
  header .subtitle { color: var(--text-muted); font-size: 0.95rem; }
  header .subtitle span { color: var(--star); font-weight: 600; }

  /* 装饰星 */
  .deco-star {

  }

  .stats { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 1rem 1.5rem; text-align: center; min-width: 130px;
    backdrop-filter: blur(10px);
    animation: fadeInUp 0.6s ease-out both;
    transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
  }
  .stat-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(59,130,246,0.15);
  }
  .stat-card:nth-child(1) { animation-delay: 0.1s; }
  .stat-card:nth-child(2) { animation-delay: 0.2s; }
  .stat-card:nth-child(3) { animation-delay: 0.3s; }
  .stat-card .num { font-size: 1.8rem; font-weight: 700; animation: countUp 0.8s ease-out both; }
  .stat-card:nth-child(1) .num { color: var(--accent); text-shadow: 0 0 20px rgba(59,130,246,0.4); }
  .stat-card:nth-child(2) .num { color: var(--star); text-shadow: 0 0 20px rgba(245,158,11,0.4); }
  .stat-card:nth-child(3) .num { color: var(--accent2); text-shadow: 0 0 20px rgba(139,92,246,0.4); }
  .stat-card .label { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.2rem; }

  .controls { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; animation: fadeInUp 0.6s ease-out 0.3s both; }

    flex: 1; min-width: 240px; padding: 0.6rem 1.2rem; font-size: 0.9rem;

    color: var(--text); outline: none; transition: all 0.3s;
    backdrop-filter: blur(10px);

    cursor: pointer; transition: all 0.3s; white-space: nowrap; font-weight: 500;
    backdrop-filter: blur(10px);

    .col-desc { display: none; }

let activeCat = 'all', sortKey = 'rank', sortAsc = true, query = '';

// ========== 渲染 ==========
function renderTabs() {
  const el = document.getElementById('cat-tabs');
  const counts = {};
  CATS.filter(c => c.key !== 'all').forEach(c => { counts[c.key] = DATA.filter(d => d.cat === c.key).length; });
  el.innerHTML = CATS.map(c => {
    const cnt = c.key === 'all' ? DATA.length : (counts[c.key] || 0);
    const cls = c.key === activeCat ? 'active' : '';
    return `<button class="cat-tab ${cls}" onclick="setCat('${c.key}')">${c.icon} ${c.label}<span class="count">${cnt}</span></button>`;
  }).join('');
}

function render() {
  renderTabs();
  let rows = activeCat === 'all' ? [...DATA] : DATA.filter(d => d.cat === activeCat);
  if (query) {
    const q = query.toLowerCase();
    rows = rows.filter(r =>
      r.name.toLowerCase().includes(q) ||
      r.owner.toLowerCase().includes(q) ||
      r.desc.toLowerCase().includes(q) ||
      r.cn.toLowerCase().includes(q) ||
      r.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  rows.sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    return sortAsc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  if (!rows.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  tbody.innerHTML = rows.map((r, i) => {
    const lcls = { rust:'lang-rust', typescript:'lang-ts', js:'lang-js', python:'lang-python', go:'lang-go' }[r.lang] || 'lang-other';
    const starsK = r.stars >= 10000 ? (r.stars/1000).toFixed(1) + 'K' : r.stars.toLocaleString();
    const badge = activeCat === 'all' && r.stars >= 90000 ? '<span class="badge badge-top">🏆</span>' : '';
    const hot = r.stars >= 30000 && activeCat === 'all' ? '<span class="badge badge-hot">🔥</span>' : '';
    const delay = (i * 0.04).toFixed(2);
    return `<tr style="animation-delay:${delay}s">
      <td class="col-rank">${r.rank}</td>
      <td class="col-name"><a href="https://github.com/${r.name}" target="_blank" rel="noopener">${r.name}</a>${badge}${hot}</td>
      <td class="col-owner"><span>${r.owner}</span></td>
      <td class="col-stars">⭐ ${starsK}</td>
      <td class="col-lang"><span class="lang-tag ${lcls}">${r.lang}</span></td>
      <td class="col-desc">${r.desc}</td>
      <td class="col-cn">${r.cn}</td>
      <td class="col-tags">${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}</td>
    </tr>`;
  }).join('');

  // 更新排序箭头
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const arrMap = { rank:'arr-rank', name:'arr-name', owner:'arr-owner', stars:'arr-stars' };
  if (arrMap[sortKey]) {
    const arr = document.getElementById(arrMap[sortKey]);
    arr.textContent = sortAsc ? '▲' : '▼';
    arr.closest('th').classList.add('sorted');
  }
}

function setCat(k) { activeCat = k; render(); }
function setSort(k) {
  if (sortKey === k) sortAsc = !sortAsc;
  else { sortKey = k; sortAsc = k === 'rank' || k === 'name'; }
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.dataset.sort === k));
  render();
}
function sortBy(col) { setSort(col); }

document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });

function initStats() {
  const total = DATA.length;
  const totalStars = DATA.reduce((s,r) => s + r.stars, 0);
  const cats = new Set(DATA.map(r => r.cat)).size;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-stars').textContent = (totalStars / 1000).toFixed(0);
  document.getElementById('stat-cats').textContent = cats;
  document.getElementById('total-count').textContent = total;
  document.getElementById('star-count').textContent = (totalStars / 1000).toFixed(0);
}

initStats();
render();
</script>
</body>
</html>
