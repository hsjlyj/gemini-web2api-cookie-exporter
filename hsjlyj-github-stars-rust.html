<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hsjlyj GitHub ★ Rust 项目一览</title>
<style>
  @keyframes floatUp {
    0%   { opacity:0; transform:translateY(30px) scale(0.95); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:0.5; }
    50%     { transform: scale(1.3); opacity:1; }
  }
  @keyframes borderPulse {
    0%,100% { border-color:rgba(59,130,246,0.2); box-shadow:0 0 6px rgba(59,130,246,0.05); }
    50%     { border-color:rgba(59,130,246,0.7); box-shadow:0 0 25px rgba(59,130,246,0.2); }
  }
  @keyframes gradientMove {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes twinkle {
    0%,100% { opacity:0.2; transform:scale(1); }
    50%     { opacity:1; transform:scale(1.8); }
  }
  @keyframes slideIn {
    0%   { opacity:0; transform:translateX(-30px); }
    100% { opacity:1; transform:translateX(0); }
  }
  @keyframes popIn {
    0%   { opacity:0; transform:scale(0.5); }
    70%  { transform:scale(1.05); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes rainbowShift {
    0%   { filter:hue-rotate(0deg); }
    100% { filter:hue-rotate(360deg); }
  }
  @keyframes glowPulse {
    0%,100% { text-shadow:0 0 10px rgba(59,130,246,0.3), 0 0 20px rgba(139,92,246,0.2); }
    50%     { text-shadow:0 0 20px rgba(59,130,246,0.6), 0 0 40px rgba(139,92,246,0.4); }
  }
  @keyframes rotate {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
  }
  @keyframes wave {
    0%,100% { transform:translateY(0) skewX(0deg); }
    25%     { transform:translateY(-3px) skewX(-1deg); }
    75%     { transform:translateY(3px) skewX(1deg); }
  }
  @keyframes scanline {
    0%   { top:-100%; }
    100% { top:100%; }
  }

  :root {
    --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235;
    --border:#1e293b; --border-h:#334155;
    --text:#e2e8f0; --muted:#94a3b8;
    --blue:#3b82f6; --purple:#8b5cf6; --cyan:#06b6d4;
    --star:#f59e0b; --green:#10b981; --red:#ef4444; --pink:#ec4899;
    --glow-b:rgba(59,130,246,0.35); --glow-p:rgba(139,92,246,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden;
    background-image:
      radial-gradient(ellipse at 15% 50%,rgba(59,130,246,0.07),transparent 55%),
      radial-gradient(ellipse at 85% 20%,rgba(139,92,246,0.06),transparent 55%),
      radial-gradient(ellipse at 50% 90%,rgba(6,182,212,0.05),transparent 55%);
  }

  /* ===== 粒子背景 ===== */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .particle{
    position:absolute;border-radius:50%;
    animation:floatUp linear infinite alternate;
  }
  .particle.glow{
    box-shadow:0 0 6px currentColor;
    animation-name:floatUp,pulse;
    animation-duration:var(--dur),var(--pdur);
    animation-timing-function:linear,ease-in-out;
    animation-iteration-count:infinite,infinite;
    animation-direction:alternate,alternate;
  }

  /* ===== 扫描线 ===== */
  .scanline{
    position:fixed;left:0;width:100%;height:3px;
    background:linear-gradient(90deg,transparent,var(--blue),var(--purple),transparent);
    opacity:0.12;z-index:999;pointer-events:none;
    animation:scanline 6s linear infinite;
  }

  .container{max-width:1440px;margin:0 auto;padding:2rem;position:relative;z-index:1}

  /* ===== Header ===== */
  header{text-align:center;margin-bottom:2.5rem;animation:floatUp .8s ease-out}
  header h1{
    font-size:2.4rem;margin-bottom:.3rem;cursor:default;
    background:linear-gradient(135deg,var(--blue),var(--purple),var(--cyan),var(--pink),var(--blue));
    background-size:400% 400%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 5s ease infinite,glowPulse 3s ease-in-out infinite;
  }
  header .emoji-row{font-size:1.6rem;margin-bottom:.3rem;animation:bounce 2s ease-in-out infinite}
  header .sub{color:var(--muted);font-size:.95rem}
  header .sub span{color:var(--star);font-weight:700}

  /* ===== Stats ===== */
  .stats{display:flex;gap:1rem;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:1rem 1.5rem;text-align:center;min-width:130px;cursor:default;
    animation:floatUp .6s ease-out both;transition:all .35s;
    position:relative;overflow:hidden;
  }
  .stat-card::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,rgba(59,130,246,0.05),rgba(139,92,246,0.05));
    opacity:0;transition:opacity .3s;
  }
  .stat-card:hover::after{opacity:1}
  .stat-card:hover{transform:translateY(-5px) scale(1.02);border-color:var(--blue);box-shadow:0 12px 30px rgba(59,130,246,0.15)}
  .stat-card:nth-child(1){animation-delay:.1s}
  .stat-card:nth-child(2){animation-delay:.2s}
  .stat-card:nth-child(3){animation-delay:.3s}
  .stat-card .num{font-size:1.8rem;font-weight:700;animation:popIn .6s ease-out both}
  .stat-card:nth-child(1) .num{color:var(--blue);text-shadow:0 0 18px rgba(59,130,246,0.5)}
  .stat-card:nth-child(2) .num{color:var(--star);text-shadow:0 0 18px rgba(245,158,11,0.5)}
  .stat-card:nth-child(3) .num{color:var(--purple);text-shadow:0 0 18px rgba(139,92,246,0.5)}
  .stat-card .label{font-size:.78rem;color:var(--muted);margin-top:.2rem}

  /* ===== Controls ===== */
  .controls{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;align-items:center;animation:floatUp .6s ease-out .2s both}
  .search-box{
    flex:1;min-width:240px;padding:.55rem 1.1rem;font-size:.9rem;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:all .3s;
  }
  .search-box:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  .search-box::placeholder{color:#475569}
  .search-icon{color:var(--muted);margin-right:.5rem;font-size:1rem}
  .sort-btn{
    padding:.42rem .95rem;font-size:.82rem;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--muted);
    cursor:pointer;transition:all .3s;white-space:nowrap;font-weight:500;
  }
  .sort-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
  .sort-btn.active{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:transparent;box-shadow:0 4px 15px rgba(59,130,246,.3)}

  /* ===== Category tabs ===== */
  .cat-tabs{
    display:flex;gap:.25rem;margin-bottom:1.4rem;flex-wrap:wrap;
    border-bottom:2px solid var(--border);padding-bottom:0;
    animation:floatUp .6s ease-out .3s both;
  }
  .cat-tab{
    padding:.35rem .8rem;font-size:.78rem;border-radius:10px 10px 0 0;
    cursor:pointer;border:1px solid transparent;border-bottom:none;
    background:transparent;color:var(--muted);font-weight:500;
    transition:all .25s;margin-bottom:-2px;white-space:nowrap;user-select:none;
  }
  .cat-tab:hover{color:var(--blue);background:rgba(59,130,246,.08)}
  .cat-tab.active{
    color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));
    border-color:transparent;font-weight:700;
    box-shadow:0 4px 18px rgba(59,130,246,.35);
    animation:borderPulse 2s ease-in-out infinite;
  }
  .cat-tab .cnt{
    display:inline-block;background:rgba(255,255,255,.1);color:rgba(255,255,255,.65);
    font-size:.62rem;padding:0 0.3rem;border-radius:100px;margin-left:3px;font-weight:600;
  }
  .cat-tab.active .cnt{background:rgba(255,255,255,.22);color:#fff}

  /* ===== Table ===== */
  .table-wrap{
    overflow-x:auto;border-radius:16px;border:1px solid var(--border);
    background:var(--surface);box-shadow:0 8px 32px rgba(0,0,0,.35);
    animation:floatUp .8s ease-out .4s both;position:relative;
  }
  /* 表头呼吸灯 */
  thead th{
    background:var(--surface2);padding:.75rem .9rem;text-align:left;
    font-weight:700;color:var(--muted);font-size:.72rem;
    text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);
    cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;z-index:2;
    transition:color .25s;
  }
  thead th:hover{color:var(--blue)}
  thead th .arrow{margin-left:3px;font-size:.6rem;opacity:.4;transition:all .25s}
  thead th.sorted .arrow{opacity:1;color:var(--blue)}

  tbody tr{
    border-bottom:1px solid rgba(30,41,59,.45);
    transition:all .3s;
    animation:slideIn .5s ease-out both;
  }
  tbody tr:hover{
    background:rgba(59,130,246,.06)!important;
    box-shadow:inset 4px 0 0 var(--blue),0 0 15px rgba(59,130,246,.08);
  }
  tbody tr:nth-child(even){background:rgba(255,255,255,.008)}
  tbody tr:nth-child(even):hover{background:rgba(59,130,246,.06)!important}

  td{padding:.6rem .85rem;vertical-align:top}
  .col-rank{width:44px;text-align:center;font-weight:700;color:var(--muted);font-size:.85rem}
  .col-name{width:210px;min-width:150px}
  .col-name a{font-weight:700;color:var(--blue);text-decoration:none;transition:all .25s;position:relative}
  .col-name a::after{content:' ↗';font-size:.7rem;opacity:0;transition:opacity .2s}
  .col-name a:hover{color:var(--cyan);text-decoration:none}
  .col-name a:hover::after{opacity:.7}
  .col-owner{width:130px}
  .col-owner span{color:var(--muted);font-size:.8rem}
  .col-stars{width:80px;text-align:right;font-weight:700;color:var(--star);font-variant-numeric:tabular-nums;white-space:nowrap}
  .col-lang{width:85px}
  .col-desc{min-width:210px;max-width:340px;color:var(--muted);font-size:.82rem;line-height:1.45}
  .col-cn{min-width:190px;max-width:310px;color:var(--green);font-size:.82rem;font-style:italic;opacity:.85;line-height:1.45}
  .col-tags{width:auto;white-space:nowrap}

  /* 加载时闪烁 */
  tbody tr td { animation: fadeIn 0.4s ease-out both; }

  .lang-tag{
    display:inline-block;padding:.1rem .4rem;border-radius:100px;
    font-size:.68rem;font-weight:600;
  }
  .lang-rust{background:rgba(210,153,34,.15);color:#f0c040}
  .lang-ts{background:rgba(59,130,246,.14);color:#60a5fa}
  .lang-js{background:rgba(245,158,11,.14);color:#fbbf24}
  .lang-python{background:rgba(59,130,246,.1);color:#60a5fa}
  .lang-go{background:rgba(6,182,212,.14);color:#22d3ee}
  .lang-other{background:rgba(100,116,139,.1);color:#94a3b8}

  .tag{
    display:inline-block;padding:.08rem .35rem;border-radius:100px;
    font-size:.63rem;font-weight:500;background:rgba(255,255,255,.04);color:var(--muted);
    margin:1px 2px;border:1px solid rgba(255,255,255,.05);transition:all .2s;
  }
  .tag:hover{background:rgba(59,130,246,.14);color:var(--blue);border-color:rgba(59,130,246,.25)}

  .badge{display:inline-block;padding:.08rem .3rem;border-radius:100px;font-size:.6rem;font-weight:700;margin-left:4px;vertical-align:middle}
  .badge-top{background:linear-gradient(135deg,var(--star),#f97316);color:#fff}
  .badge-hot{background:linear-gradient(135deg,var(--red),var(--pink));color:#fff;animation:pulse 2s ease-in-out infinite}

  .empty{text-align:center;padding:4rem;color:var(--muted);font-size:1.1rem;animation:fadeIn .6s}
  .empty::before{content:'🔍';display:block;font-size:2.5rem;margin-bottom:.8rem;animation:bounce 2s ease-in-out infinite}
  .hidden{display:none!important}

  /* 底部流光 */
  .footer-line{
    height:2px;margin:2.5rem 0 1rem;
    background:linear-gradient(90deg,transparent 0%,var(--blue) 25%,var(--purple) 50%,var(--cyan) 75%,transparent 100%);
    background-size:200% 100%;
    animation:shimmer 4s linear infinite;
    opacity:.5;
  }
  footer{text-align:center;color:var(--muted);font-size:.78rem;animation:fadeIn 1s ease-out .8s both}

  /* 滚动条 */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-h)}

  /* 响应式 */
  @media(max-width:900px){
    body{padding:.5rem}
    .container{padding:1rem}
    header h1{font-size:1.5rem}
    .col-cn,.col-tags{display:none}
    .col-name{width:130px}
    .col-desc{min-width:110px;max-width:170px}
    .col-owner{width:85px}
    .stat-card{min-width:90px;padding:.6rem .8rem}
  }
  @media(max-width:600px){
    .col-desc{display:none}
    header h1{font-size:1.2rem}
    header .emoji-row{font-size:1.2rem}
  }
</style>
</head>

!function(){
  const box=document.getElementById('particles');
  const COLORS=['rgba(59,130,246,','rgba(139,92,246,','rgba(6,182,212,','rgba(245,158,11,','rgba(236,72,153,'];
  for(let i=0;i<60;i++){
    const d=document.createElement('div');
    d.className='particle glow';
    const sz=Math.random()*3.5+1;
    const dur=Math.random()*15+10;
    const pdur=Math.random()*4+2;
    const clr=COLORS[Math.floor(Math.random()*COLORS.length)]+(Math.random()*.18+.04)+')';
    d.style.cssText=`
      width:${sz}px;height:${sz}px;background:${clr};color:${clr};
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      --dur:${dur}s;--pdur:${pdur}s;
      animation-duration:${dur}s,${pdur}s;
      animation-delay:${Math.random()*dur*-1}s,${Math.random()*pdur*-1}s;
    `;
    box.appendChild(d);
  }
}();

let ac='all',sk='rank',sa=true,q='';

function rc(){
  const el=document.getElementById('cat-tabs');
  const ct={};
  CATS.filter(c=>c.k!=='all').forEach(c=>{ct[c.k]=DATA.filter(d=>d.c===c.k).length;});
  el.innerHTML=CATS.map(c=>{
    const cnt=c.k==='all'?DATA.length:(ct[c.k]||0);
    const cls=c.k===ac?'active':'';
    return`<button class="cat-tab ${cls}" onclick="sc('${c.k}')">${c.i} ${c.l}<span class="cnt">${cnt}</span></button>`;
  }).join('');
}

function rs(){
  rc();
  let rows=ac==='all'?[...DATA]:DATA.filter(d=>d.c===ac);
  if(q){
    const ql=q.toLowerCase();
    rows=rows.filter(r=>
      r.n.toLowerCase().includes(ql)||
      r.o.toLowerCase().includes(ql)||
      r.d.toLowerCase().includes(ql)||
      r.cn.toLowerCase().includes(ql)||
      r.t.some(t=>t.toLowerCase().includes(ql))
    );
  }
  rows.sort((a,b)=>{
    let va=a[sk],vb=b[sk];
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
    return sa?(va>vb?1:-1):(va<vb?1:-1);
  });

  const tb=document.getElementById('tbody');
  const ep=document.getElementById('empty');
  if(!rows.length){tb.innerHTML='';ep.classList.remove('hidden');return;}
  ep.classList.add('hidden');

  tb.innerHTML=rows.map((r,i)=>{
    const lc={'rust':'lang-rust','typescript':'lang-ts','js':'lang-js','python':'lang-python','go':'lang-go'}[r.l]||'lang-other';
    const sk=r.s>=10000?(r.s/1000).toFixed(1)+'K':r.s.toLocaleString();
    const bd=ac==='all'&&r.s>=90000?'<span class="badge badge-top">🏆</span>':'';
    const ht=r.s>=30000&&ac==='all'?'<span class="badge badge-hot">🔥</span>':'';
    const dl=(i*.035).toFixed(3);
    return`<tr style="animation-delay:${dl}s">
      <td class="col-rank">${r.r}</td>
      <td class="col-name"><a href="https://github.com/${r.n}" target="_blank" rel="noopener">${r.n}</a>${bd}${ht}</td>
      <td class="col-owner"><span>${r.o}</span></td>
      <td class="col-stars">⭐ ${sk}</td>
      <td class="col-lang"><span class="lang-tag ${lc}">${r.l}</span></td>
      <td class="col-desc">${r.d}</td>
      <td class="col-cn">${r.cn}</td>
      <td class="col-tags">${r.t.map(t=>`<span class="tag">${t}</span>`).join('')}</td>
    </tr>`;
  }).join('');

  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sorted'));
  const am={rank:'arr-rank',name:'arr-name',owner:'arr-owner',stars:'arr-stars'};
  if(am[sk]){
    const a=document.getElementById(am[sk]);
    a.textContent=sa?'▲':'▼';
    a.closest('th').classList.add('sorted');
  }
}

function sc(k){ac=k;rs()}
function ss(k){
  if(sk===k)sa=!sa;
  else{sk=k;sa=k==='rank'||k==='name';}
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort===k));
  rs();
}
function sb(c){ss(c)}
